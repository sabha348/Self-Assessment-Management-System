name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rag-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag_service/requirements*.txt
      - run: pip install -r rag_service/requirements-dev.txt
      - name: Lint
        working-directory: rag_service
        run: ruff check . && ruff format --check .
      - name: Test RAG service (DB tests run against pgvector)
        working-directory: rag_service
        run: pytest -q
      - name: Lint evals
        working-directory: evals
        run: ruff check .
      - name: Test eval harnesses
        working-directory: evals
        run: pytest -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Production build
        working-directory: frontend
        # Existing lint warnings are not fatal (CRA treats them as errors when CI=true).
        run: CI=false npx react-scripts build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: GOOGLE_API_KEY=unused docker compose build
