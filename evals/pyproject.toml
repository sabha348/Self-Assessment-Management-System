[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]  # scripts put rag_service on sys.path before importing it

[tool.ruff.lint.isort]
known-first-party = ["app", "labels", "metrics"]
